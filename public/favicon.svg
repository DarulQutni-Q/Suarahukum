<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background dark navy -->
  <rect width="100" height="100" rx="22" fill="#0d1f35"/>
  
  <!-- Scale icon (mimicking lucide Scale), colored gold #C9982A -->
  <g transform="translate(50,50)" stroke="#C9982A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Vertical pole -->
    <line x1="0" y1="-32" x2="0" y2="32"/>
    <!-- Base horizontal bar -->
    <line x1="-18" y1="32" x2="18" y2="32"/>
    <!-- Top horizontal beam -->
    <line x1="-28" y1="-32" x2="28" y2="-32"/>
    <!-- Left chain -->
    <line x1="-28" y1="-32" x2="-28" y2="-10"/>
    <!-- Right chain -->
    <line x1="28" y1="-32" x2="28" y2="-10"/>
    <!-- Left pan (arc) -->
    <path d="M -42,-10 Q -28,10 -14,-10" />
    <!-- Right pan (arc) -->
    <path d="M 14,-10 Q 28,10 42,-10" />
  </g>
</svg>
